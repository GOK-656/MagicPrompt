<!DOCTYPE html>
<html lang="en">
    {% include "base_head.html"%}
    <head>
        <link
            rel="stylesheet"
            href="static/css/style_search.css"
            type="text/css"
        />
        <link
            rel="stylesheet"
            href="static/css/style_index.css"
            type="text/css"
        />
        <link
            rel="stylesheet"
            href="static/css/style_generate.css"
            type="text/css"
        />
        <link
            rel="stylesheet"
            href="static/css/style_current.css"
            type="text/css"
        />
    </head>
    <body>
        <nav>
            <div id="nav-title"><a href="/">Magic Prompt</a></div>
            <div id="nav-link">
                <a href="/" class="page_this">主页</a>
                <a href="/search">搜索</a>
                <a href="/generate">生成</a>
                <a href="https://github.com/GOK-656/MagicPrompt">
                    <img
                        src="static/src/github.svg"
                        alt="search icon"
                        width="20"
                        height="20"
                 /></a>
            </div>
        </nav>
        <main>
            <div
                class="card lg:card-side bg-base-100 shadow-xl"
                id="img-choice-card"
            >
                <figure>
                    <img
                        src="data:;base64,{{img_stream}}"
                        alt="uploaded image"
                    />
                </figure>
                <div class="card-body">
                    <h2 class="card-title">
                        您想对<span class="italic-yellow-underline">img2text</span> 的结果做什么?
                    </h2>
                    <div>
                        <p class="text-5xl font-semibold text-blue-500">“</p>
                        <p
                            id="img2text-wrapper"
                        >
                            {{currentValue}}
                        </p>
                    </div>
                    <div id="card-actions">
                        <form action="/search" method="post">
                            <input
                                type="hidden"
                                name="query"
                                value="{{ currentValue }}"
                            />
                            <button
                                class="btn btn-bloc"
                                onclick="button2loading(this)"
                            >
                                搜索相似图片
                            </button>
                        </form>
                        <form action="/generate" method="post">
                            <input
                                type="hidden"
                                name="query"
                                value="{{ currentValue }}"
                            />

                            <button
                                class="btn btn-bloc btn-neutral"
                                onclick="button2loading(this)"
                            >
                                生成更好的prompt
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </main>
        <script src="https://cdn.bootcss.com/jquery/3.4.1/jquery.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/semantic-ui@2.5.0/dist/semantic.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/clipboard.js/2.0.11/clipboard.min.js"></script>
        <script src="static/js/script.js"></script>
    </body>
</html>
